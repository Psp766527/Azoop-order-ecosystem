apiVersion: v1
kind: Service
metadata:
  name: rubiconwater-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: rubiconwater
  ports:
    - name: web
      protocol: TCP
      port: 8081
      targetPort: 8100
    - name: debug
      protocol: TCP
      port: 5005
      targetPort: 5005